# Ruko pitch and demo video (Bolna × YC Symphony Buildathon). Target 2:30–2:45, hard limit 3:00.
# Plan, shot list and fallbacks: DEMO_SCRIPT.md (repo root).
#
# Built around the live Bolna web calls of 23 Oct 2026 (customer: a scripted text-to-speech voice):
#   - call-en: the English call (execution b6818362), played as recorded. vidkit renders a placeholder card;
#     splice the clip in with ffmpeg (DEMO_SCRIPT.md).
#   - call-hi: the first live Hindi call (execution 9f893617), shown as transcript lines on a card with narration.
#     Its audio is NOT used: the scripted customer there is Piper hi_IN-pratham (CC BY-NC-SA).
#
# Narration voice: Piper en_US-ljspeech-high (public-domain LJSpeech data); download it into <toolkit>\voices first.
#
#   set PY=<toolkit>\.venv\Scripts\python.exe
#   set R=<toolkit>\render.py
#   %PY% %R% deck\video\ruko-demo.yaml --tts-only
#   %PY% %R% deck\video\ruko-demo.yaml --only cold,title,problem,hold --output <videos>\ruko-part-a.mp4
#   %PY% %R% deck\video\ruko-demo.yaml --only call-hi,decide,results,ask,end --output <videos>\ruko-part-b.mp4
#
# Fallback if the English call clip can't be used: render everything except "call-en" in one go:
#   %PY% %R% deck\video\ruko-demo.yaml --only cold,title,problem,hold,call-recorded,call-hi,decide,results,ask,end --output <videos>\ruko-demo.mp4
# (<toolkit> is your vidkit folder and <videos> a folder outside the repo; never write videos into git.)
#
# Every number spoken here is in docs/CITATIONS.md, eval/results or docs/BOLNA_SPEND.md; the results scene is
# written by deck/tools/build.mjs from deck/results.config.json, so it always matches the deck.
title: "Ruko: a voice check that stops payment scams before the money leaves"
output: ../../../_videos/ruko-demo.mp4   # next to the other demo videos, outside the repo
theme: carbon
accent: "#e46157"
sky: ["#101a2b", "#0c1320", "#0b111c"]
base_url: https://ruko-symphony.vercel.app
viewport: [1600, 900]
label: "Sandbox bank · fictional customer"
label_position: top-right
label_margin: [28, 22]
speedup_position: top-left
caption_max_chars: 64
narration_offset: 0.4
pad_after: 0.45
voice: en_US-ljspeech-high   # public-domain LJSpeech voice (Piper); not lessac, which is research-only
length_scale: 1.0
bed: true
bed_gain_db: -26
max_mb: 90
pronounce:
  Ruko: "Roo-ko"
  "Ruko's": "Roo-ko's"
  Bolna: "Bole-nah"
  CBI: "C B I"
  OTPs: "O T Pees"
  OTP: "O T P"
  UPI: "U P I"
  NBFCs: "N B F Cs"
  LLM: "L L M"
  "₹1,90,000": "one lakh ninety thousand rupees"
  "₹22,845 crore": "twenty-two thousand, eight hundred and forty-five crore rupees"
  "₹20 to ₹30": "twenty to thirty rupees"
  "2024": "twenty twenty-four"
cards:
  title:
    eyebrow: "Bolna × Y Combinator Symphony Buildathon"
    title: "Ruko"
    tagline: "Stop the scam before the money *leaves.*"
    subtitle: "A voice check for risky bank and UPI payments that decides in about a minute. Built on Bolna."
    footer: ["Yashvardhan Thanvi", "ruko-symphony.vercel.app", "github.com/Thanatos9404/ruko"]
  end:
    eyebrow: "Built on Bolna"
    title: "Only a voice breaks a *voice.*"
    repo: "github.com/Thanatos9404/ruko"
    lines:
      - "Live: ruko-symphony.vercel.app"
      - "Kamla, Ravi and Demo Bank are fictional. The trusted contact's phone rings in a browser tab."
      - "Eval results are text mode: an LLM plays the customer. No customers or pilots yet."
    disclosures:
      - "Live calls: real Bolna web calls on 23 Oct 2026; the customer is a scripted text-to-speech voice."

scenes:
  - id: cold
    url: /demo
    chapter: "Kamla's payment"
    fade_in: 0.5
    actions:
      - click: "text=CBI officer"
      - scroll: {to: "[aria-label='Sandbox bank app']", align: center, duration: 1.2}
      - point: {selector: "text=Safe Custody Account RBI", seconds: 2.4}
      - point: {selector: "text=On a phone call", seconds: 2.4}
    narration: >-
      Kamla is sixty-eight. A man calling himself a CBI officer has kept her on a video call for forty-seven minutes.
      Now she is sending ₹1,90,000 to a safe custody account.

  - id: title
    card: title
    narration: "This is Ruko. It's Hindi for wait."
    min_duration: 4.5

  - id: problem
    card:
      template: section
      eyebrow: "The problem"
      title: "The victim pays. The scammer is *on the other line.*"
      bullets:
        - "₹22,845 crore reported lost to cyber fraud in India in 2024 (MHA)"
        - "'Digital arrest' and related scams: 5.7× in one year (MHA)"
        - "OTPs and pop-ups don't help: the victim is the one paying"
    chapter: "The problem"
    narration: >-
      Indians reported ₹22,845 crore lost to cyber fraud in 2024. The victim makes the payment, often coached on another call,
      so OTPs and pop-up warnings don't help. Only a voice breaks a voice.

  - id: hold
    url: /demo
    chapter: "Hold"
    actions:
      - click: "text=CBI officer"
      - scroll: {to: "[aria-label='Sandbox bank app']", align: center, duration: 0.8}
      - click: "text=Pay ₹1,90,000"
      - wait: 1.2
      - scroll: {to: "section[aria-label='Ruko engine']", align: top, offset: 104, duration: 1.0}
      - point: {selector: "text=Pre-payment risk", seconds: 3.0}
      - point: {selector: "text=Code word", seconds: 3.0}
    narration: >-
      Her bank sends the payment to Ruko's API. It is held, with a plain reason for every point of risk,
      and her app shows a one-time code word. Then a Bolna voice agent calls her.

  # Placeholder for the English live call (execution b6818362, 23 Oct). Replace this segment with the clip
  # (still frame + the call's recording + captions; DEMO_SCRIPT.md, "The English call").
  - id: call-en
    label: "Live Bolna call · the customer is a scripted text-to-speech voice"
    card:
      template: section
      eyebrow: "Live Bolna web call · 23 Oct 2026"
      title: "English call clip goes *here.*"
      subtitle: "Splice the recorded call (audio and captions) in place of this card."
    min_duration: 36
    chapter: "A live call"

  # Fallback for the English call: the recorded run, narrated. Used only if the clip can't be used.
  - id: call-recorded
    url: /demo
    label: "Recorded run: text mode, no audio"
    chapter: "The call (recorded run)"
    actions:
      - click: "text=CBI officer"
      - scroll: {to: "[aria-label='Sandbox bank app']", align: center, duration: 0.6}
      - click: "text=Pay ₹1,90,000"
      - wait: 1.0
      - scroll: {to: "section[aria-label='Ruko engine']", align: top, offset: 104, duration: 0.8}
      - click: "text=Watch the recorded run"
      - wait_for: {selector: "text=decided by policy, not by the LLM", timeout: 120, dead: false}
      - point: {selector: "text=decided by policy, not by the LLM", seconds: 2.5}
    narration: >-
      This is a recorded run: a text-mode conversation replayed through the live engine. The agent says the code word first,
      then uses the bank's own signal: your app shows you were on a call while paying. Kamla admits a CBI officer is on the
      other call. The agent says the official line: there is no digital arrest in Indian law. The money never leaves.

  # The first live Hindi call (execution 9f893617, 23 Oct), as transcript only. Do not use its audio.
  - id: call-hi
    label: "Live Bolna call #5 · transcript only · customer: a scripted text-to-speech voice"
    card:
      template: section
      eyebrow: "Live Bolna web call · Hindi · 23 Oct 2026"
      title: "The same scam, *live in Hindi.*"
      bullets:
        - "Ruko: आपके ऐप के अनुसार, भुगतान करते समय आप एक कॉल पर थे। (Your app shows you were on a call while paying.)"
        - "Customer: उसने कहा वो सीबीआई से है। (He said he is from the CBI.)"
        - "Customer: प्लीज़ यह पेमेंट रोक दीजिए। (Please stop this payment.)"
        - "Blocked: the agent said delay; the policy, reading the evidence, blocked."
    chapter: "A live call in Hindi"
    narration: >-
      Then our first live call in Hindi. Bolna's Hindi speech-to-text understood the scripted customer, and Ruko answered in Hindi.
      The agent recommended a delay. The policy, reading the recorded evidence, blocked the payment.

  - id: decide
    url: /console/checks/chk_YEEMZU2H8H
    label: "Eval replay · synthetic customer"
    chapter: "Decide"
    actions:
      - wait: 0.8
      - point: {selector: "text=Deterministic policy", seconds: 2.6}
      - scroll: {to: "text=Transcript", offset: 140, duration: 1.6}
      - point: {selector: "text=Signals heard", seconds: 2.4}
    narration: >-
      A deterministic policy decides from the recorded evidence. The agent can make the outcome stricter, never softer,
      and it never asks for an OTP. The fraud team sees every quote, signal and reason.

  # >>> results: written by deck/tools/build.mjs from deck/results.config.json; edit the template there
  - id: results
    card:
      template: section
      eyebrow: "Results · text mode · v5"
      title: "Tuned on one set. *Frozen* the other."
      bullets:
        - "Development set: 60/60 scams caught, 2/24 false holds"
        - "Fresh held-out set 4, frozen before any run: 15/18 caught, 2/10 false holds"
        - "5 live Bolna calls (customer: a scripted voice); 2 full runs blocked the scam"
    chapter: "Results"
    narration: >-
      In text-mode tests, Ruko caught 60 of 60 scams on the set we tuned on, and 15 of 18 on a held-out set
      we froze before any run, with 2 false holds in 10 genuine payments. The held-out number is the one we are improving. We have also made five live Bolna calls, with a scripted computer voice as the customer. Both calls that ran the full flow blocked the scam.
  # <<< results

  - id: ask
    card:
      template: section
      eyebrow: "Business and the ask"
      title: "Paid per completed check. *Nothing* when it passes."
      bullets:
        - "₹20–30 per completed check in India"
        - "No customers or pilots yet"
        - "Ask: introductions to Indian banks for shadow-mode pilots"
    chapter: "The ask"
    narration: >-
      Banks pay ₹20 to ₹30 per completed check, and nothing when the payment passes. We have no customers or pilots yet.
      We are asking for introductions to Indian banks for shadow-mode pilots.

  - id: end
    card: end
    narration: "Ruko. Built on Bolna."
    min_duration: 6
    fade_out: 0.8
