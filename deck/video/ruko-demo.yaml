# Ruko: demo and pitch video for the Bolna x Y Combinator Symphony Buildathon (due 31 Oct 2026). Limit 3:00.
# This is the spec the submitted video (ruko-demo.mp4, 2:49) was rendered from; DEMO_SCRIPT.md describes it scene
# by scene. Placeholders stand for folders outside this repo:
#   <toolkit>  the vidkit toolkit (Piper voice en_US-ljspeech-high in its voices folder)
#   <scenes>   the folder holding ruko/build.py, the scene driver (brand cards, the live-call scenes and one
#              loudness-normalised mix), and ruko/assets/ (the Hindi call's console still)
#   <videos>   where the video is written (videos and call audio never go into git)
#   <repo>     this repository
#
# Render, from <scenes> (copy this file there):
#   <toolkit>\.venv\Scripts\python.exe ruko\build.py ruko-demo.yaml                    # TTS -> record -> assemble
#   <toolkit>\.venv\Scripts\python.exe ruko\build.py ruko-demo.yaml --reuse-recording  # re-assemble only
#   <toolkit>\.venv\Scripts\python.exe ruko\build.py ruko-demo.yaml --tts-only         # narration timings
# Each recording presses Pay twice in the production sandbox (warm-up + take): free, and no Bolna call is made.
# Plain vidkit render.py also parses this file, but it cannot build the call scenes (they need ruko/build.py).
#
# Sources (read-only, from the Ruko repo; nothing is written there):
#   - English live call #2, execution b6818362 (23 Oct 2026): Bolna's own recording (.data/live/smoke-en-2.flac,
#     stereo: customer left, agent right, each side's silences removed by Bolna) and Bolna's transcript
#     (.data/live/execution-smoke-en-2-*.json). Customer: scripted Windows "Zira" text-to-speech; Ruko: live Bolna
#     agent. The two channels are not time-aligned in the file, so build.py cuts each utterance out unchanged and
#     lays them in Bolna's transcript order (see ruko/build.py, CALL_EN). Bolna's recording ends before the agent's
#     last line ("For your safety, this payment is stopped..."); the outro says so.
#   - Hindi live call #5, execution 9f893617: transcript only. Its audio is NOT used (customer voice: Piper
#     hi_IN-pratham, CC BY-NC-SA).
#   - Engine events and decisions: .data/live/call-*.json and the public console (chk_B3RQU9A6M6, chk_KEFA2WGBYA).
#   - Numbers: public/eval/results.json (v5, text mode) and docs/BOLNA_SPEND.md. No customers or pilots are claimed.
#
# Narration voice: Piper en_US-ljspeech-high (LJSpeech, public domain), in <toolkit>\voices\en_US-ljspeech-high\.
title: "Ruko: a voice check that stops payment scams before the money leaves"
output: <videos>/ruko-demo.mp4
theme: carbon
accent: "#e46157"
sky: ["#0b111c", "#111a28", "#172133"]
base_url: https://ruko-symphony.vercel.app
viewport: [1600, 900]
label: "Sandbox bank · fictional customer"
label_position: top-right
label_margin: [28, 96]   # below the site's floating nav pill (painted scenes use their own spot)
speedup_position: top-left
caption_max_chars: 66
narration_offset: 0.35
pad_after: 0.45
sentence_gap: 0.32
voice: en_US-ljspeech-high/en_US-ljspeech-high   # public-domain LJSpeech voice; not lessac (research-only)
length_scale: 0.95
bed: true
bed_gain_db: -27
max_mb: 90
default_timeout: 45
pronounce:
  Ruko: "Rooko"          # espeak: /ɹˈʊkəʊ/, close to Hindi रुको
  Bolna: "Bowlnah"       # espeak: /bˈəʊlnə/ (plain "Bolna" comes out /bˈɒlnə/)
  CBI: "C B I"
  OTPs: "O T Pees"
  OTP: "O T P"
  API: "A P I"
  "₹1,90,000": "one lakh ninety thousand rupees"
  "₹22,845 crore": "twenty-two thousand, eight hundred and forty-five crore rupees"
  "₹20 to ₹30": "twenty to thirty rupees"
  "2024": "twenty twenty-four"
  "60 of 60": "sixty of sixty"
  "15 of 18": "fifteen of eighteen"
  "2 false holds in 10": "two false holds in ten"

# Brand (deck/deck.css): ink/navy #161f2e, paper #fdfdfb, coral #e46157, dark slides #0b111c.
ruko:
  repo: <repo>
  brand: { navy: "#0b111c", navy2: "#111a28", ink: "#161f2e", paper: "#fdfdfb", coral: "#e46157" }
  call_en:
    recording: .data/live/smoke-en-2.flac
    execution: .data/live/execution-smoke-en-2-b6818362-8118-49fd-8f76-146432254c27.json
    events: .data/live/call-2026-10-23T09-23-57-027Z.json
    label: "Live Bolna web call · customer: scripted text-to-speech · Ruko: live Bolna agent"
  call_hi:
    execution: .data/live/execution-hero-hi-9f893617-24cd-4d04-a693-5ae88ee06554.json
    events: .data/live/call-2026-10-23T14-56-28-122Z.json
    still: <scenes>/ruko/assets/console-chk_KEFA2WGBYA.png
    label: "First live Hindi call · shown as transcript"

setup:
  # Not in the video: open the sandbox, warm the hold endpoint once (a serverless cold start can take seconds;
  # a sandbox hold is free and calls nobody), reset, pick the CBI scenario and bring the phone into view.
  - goto: {url: /demo, settle: 1.5}
  - wait_for: {selector: "text=CBI officer", timeout: 60}
  - click: "text=CBI officer"
  - click: "text=Pay ₹1,90,000"
  - wait_for: {selector: "text=Payment paused", timeout: 60}
  - click: "text=Reset"
  - wait_for: {selector: "text=Pay ₹1,90,000", timeout: 20}
  - click: "text=CBI officer"
  # Phone low enough that the page's next section ("Hear a real call") stays below the frame and the captions
  # only overlap the phone's bottom bezel.
  - scroll: {to: "[aria-label='Sandbox bank app']", align: top, offset: 156, duration: 0.3}
  - wait: 0.8

scenes:
  # Cold open: the coral "Payment paused" screen is up by about 3.5 s (inside the first 5 s).
  - id: cold
    chapter: "Payment paused"
    fade_in: 0.3
    actions:
      - point: {selector: "text=On a phone call", seconds: 0.9, pad: 6}
      - click: {selector: "text=Pay ₹1,90,000", ms: 380, pause_before: 0.12, pause_after: 0.1}
      # a server wait over 1.8 s is shown sped up and labelled (vidkit), so the coral screen lands by ~3 s
      - wait_for: {selector: "text=Payment paused", timeout: 30, dead: true, settle: 0.1}
      - scroll: {to: "[aria-label='Sandbox bank app']", align: top, offset: 156, duration: 0.5, pause_after: 0.1}
      - point: {selector: "text=Payment paused", seconds: 2.8, pad: 10}
      - point: {selector: "text=Code word", until: 12.0, pad: 10}
    narration: >-
      Kamla is sixty-eight. A man claiming to be a CBI officer has kept her on a video call for forty-seven minutes,
      and she is sending ₹1,90,000 to a safe custody account. Ruko paused it.

  - id: title
    card: {template: ruko-title}
    narration: "This is Ruko. It's Hindi for wait."
    min_duration: 3.4

  - id: problem
    chapter: "The problem"
    card: {template: ruko-problem}
    narration: >-
      In 2024, Indians reported ₹22,845 crore lost to cyber fraud. The victim makes the payment, coached on another
      call, so OTPs don't help. Only a voice breaks a voice.

  # Same page, same held payment as the cold open (no reload): the engine's side of the hold.
  - id: hold
    chapter: "Hold"
    actions:
      - wait: 0.3
      - point: {selector: "text=Pre-payment risk", seconds: 2.6, pad: 8}
      - point: {selector: "text=On a call while paying", seconds: 2.4, pad: 6}
      - point: {selector: "text=Payee looks like a 'safe account'", seconds: 2.2, pad: 6}
      - point: {selector: "text=Answer the call", until: 11.9, pad: 8}
    narration: >-
      Her bank sends the payment to Ruko's API. It is held, with a plain reason for every point of risk,
      and her app shows a one-time code word. Then a Bolna voice agent calls her.

  # The English live call, execution b6818362. Three scenes, one continuous picture (ruko/build.py).
  - id: call-intro
    chapter: "A live Bolna call"
    card: {template: ruko-call-en, phase: intro}
    narration: "Here is a live Bolna call, with a scripted computer voice playing the customer."
  - id: call-en
    card: {template: ruko-call-en, phase: call}
  - id: call-outro
    card: {template: ruko-call-en, phase: outro}
    narration: >-
      That is where Bolna's recording ends. Its transcript has the rest: the payment is stopped, and Ruko offers to call her son.

  # The first live Hindi call, execution 9f893617: transcript lines over a still of its console page. No audio.
  - id: call-hi
    chapter: "A live call in Hindi"
    card: {template: ruko-call-hi}
    narration: >-
      Next, our first live call in Hindi: Bolna understood the scripted customer, and Ruko answered in Hindi.
      The agent recommended a delay; the policy, reading the evidence, blocked the payment.

  - id: decide
    url: /console/checks/chk_YEEMZU2H8H
    label: "Eval replay · synthetic customer"
    chapter: "Decide"
    actions:
      - wait: 0.5
      - scroll: {to: "text=Deterministic policy", align: top, offset: 190, duration: 0.9}
      - point: {selector: "text=Deterministic policy", seconds: 2.0, pad: 8}
      - point: {selector: "text=MULTIPLE_STRONG_SIGNS", seconds: 1.3, pad: 8}
      # the transcript's highlighted evidence (left) next to the signals it backs (right); scroll the page to the
      # Transcript heading first (the quotes sit in their own scroll box)
      - scroll: {to: "text=Transcript", align: top, offset: 171, duration: 1.1}
      - point: {selector: "mark", seconds: 1.8, pad: 6, scroll: false}
      - point: {selector: "text=A stranger or 'official' is directing them on another call", until: 13.2, pad: 8, scroll: false}
    narration: >-
      A deterministic policy decides from the recorded evidence. The agent can make the outcome stricter, never softer,
      and it never asks for an OTP. The fraud team sees every quote, signal and reason.

  - id: results
    chapter: "Results"
    card: {template: ruko-results}
    narration: >-
      In our text-mode evaluation, Ruko caught 60 of 60 scams on the set we tuned it on, and 15 of 18 on a held-out set
      frozen before any run, with 2 false holds in 10 genuine payments. In five live Bolna calls with a scripted
      customer voice, both full runs blocked the scam.

  - id: ask
    chapter: "The ask"
    card: {template: ruko-ask}
    narration: >-
      We plan to charge ₹20 to ₹30 per completed check, and nothing when the payment passes. We have no customers
      or pilots yet. We're asking for introductions to Indian banks for shadow-mode pilots.

  - id: end
    card: {template: ruko-end}
    narration: "Ruko. Built on Bolna."
    min_duration: 5.5
    fade_out: 0.8
